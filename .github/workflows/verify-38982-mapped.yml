name: Verify issue 38982 mapped tests

on:
  push:
    branches:
      - ci_38982_lint
    paths:
      - .github/workflows/verify-38982-mapped.yml

permissions:
  contents: read

jobs:
  mapped-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install test dependencies
        run: |
          uv sync --frozen --group proxy-dev --group e2e-dev
          uv pip install orjson

      - name: Run full mapped test file
        run: uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py -q
