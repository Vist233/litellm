name: Verify issue 38982 lint gates

on:
  push:
    branches:
      - ci_38982_lint

permissions:
  contents: read
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATE_BASE_SHA: 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Fetch gate base
        run: git fetch --no-tags --depth=1 origin "$GATE_BASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Update Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Check uv.lock
        run: uv lock --check

      - name: Install dependencies
        run: |
          uv sync --frozen --group proxy-dev --group e2e-dev
          uv pip install orjson

      - name: Generate Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Check changed production formatting
        run: |
          git diff --name-only --diff-filter=ACMR "$GATE_BASE_SHA" HEAD -- 'litellm/**/*.py' > "$RUNNER_TEMP/ruff_format_files.txt" || true
          if [ -s "$RUNNER_TEMP/ruff_format_files.txt" ]; then
            xargs uv run --no-sync ruff format --check < "$RUNNER_TEMP/ruff_format_files.txt"
          else
            echo "No changed production Python files."
          fi

      - name: Run Ruff linting
        run: |
          cd litellm
          uv run --no-sync ruff check .

      - name: Run Ruff linting on tests
        run: uv run --no-sync ruff check --config ruff-tests.toml tests

      - name: Check strict-rule delta
        run: uv run --no-sync python scripts/ruff_strict_gate.py --base "$GATE_BASE_SHA"

      - name: Check type-discipline delta
        run: uv run --no-sync python scripts/type_discipline_gate.py --base "$GATE_BASE_SHA"

      - name: Check test-quality delta
        run: uv run --no-sync python scripts/test_quality_gate.py --base "$GATE_BASE_SHA"

      - name: Check basedpyright delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/type_check_gate.py --base "$GATE_BASE_SHA"

      - name: Focused regression tests
        run: uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py::TestFilterWebSearchDeployments -q

      - name: Full mapped test file
        run: uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py -q
