name: Validate scoped 38982 cleanup

on:
  push:
    branches:
      - ci_38982_review_fixes

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
      - name: Build scoped candidate
        run: |
          git show e40354b0d2c7b70ca9354252b2c71eda32b9720a:tests/test_litellm/router_utils/test_router_utils_common_utils.py > /tmp/current.py
          git checkout --detach e40354b0d2c7b70ca9354252b2c71eda32b9720a
          git show 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a:tests/test_litellm/router_utils/test_router_utils_common_utils.py > tests/test_litellm/router_utils/test_router_utils_common_utils.py
          python - <<'PY'
          from pathlib import Path
          current = Path('/tmp/current.py').read_text()
          path = Path('tests/test_litellm/router_utils/test_router_utils_common_utils.py')
          base = path.read_text()
          start = current.index('    def test_anthropic_versioned_web_search_filters_unsupported')
          end_marker = '\n\ndef test_invalidate_model_group_info_cache'
          end = current.index(end_marker, start)
          added = current[start:end]
          base = base.replace('from typing import Dict, List, Optional, Union', 'from typing import Dict, Final, List, Optional, Union', 1)
          base = base.replace('from litellm.proxy._types import UserAPIKeyAuth\n', 'from litellm.proxy._types import UserAPIKeyAuth\nfrom litellm.types.router import RouterRateLimitError\n', 1)
          path.write_text(base.replace(end_marker, '\n\n' + added + end_marker, 1))
          PY
          git diff --check
      - name: Install and validate
        run: |
          uv sync --frozen --group proxy-dev --group e2e-dev
          uv pip install orjson
          uv run --no-sync ruff check --config ruff-tests.toml tests/test_litellm/router_utils/test_router_utils_common_utils.py
          uv run --no-sync python scripts/type_discipline_gate.py --base 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a
          uv run --no-sync python scripts/test_quality_gate.py --base 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a
          uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py::TestFilterWebSearchDeployments -q
          uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py -q
      - name: Publish cleanup
        env:
          TARGET_BRANCH: litellm_fix_38982_anthropic_server_tool_routing
          EXPECTED_HEAD: e40354b0d2c7b70ca9354252b2c71eda32b9720a
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name Vist233
          git config user.email 144699295+Vist233@users.noreply.github.com
          git add tests/test_litellm/router_utils/test_router_utils_common_utils.py
          git commit -m "test(router): keep server-tool regression diff scoped"
          git push origin HEAD:"$TARGET_BRANCH"
