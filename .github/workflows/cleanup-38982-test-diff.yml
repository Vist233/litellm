name: Validate 38982 scope cleanup

on:
  push:
    branches: [ci_38982_scope_cleanup]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"
      - name: Restore base test file and add only scoped tests
        run: |
          git checkout 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a -- tests/test_litellm/router_utils/test_router_utils_common_utils.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_litellm/router_utils/test_router_utils_common_utils.py")
          text = path.read_text()
          text = text.replace("from typing import Dict, List, Optional, Union", "from typing import Dict, Final, List, Optional, Union", 1)
          text = text.replace(
              "from litellm.proxy._types import UserAPIKeyAuth\n",
              "from litellm.proxy._types import UserAPIKeyAuth\nfrom litellm.types.router import RouterRateLimitError\n",
              1,
          )
          anchor = "\n\ndef test_invalidate_model_group_info_cache():"
          section = '''\n\n    def test_anthropic_versioned_web_search_filters_unsupported(self, sample_deployments):
        request_kwargs: Final = {"tools": [{"type": "web_search_20250305", "name": "web_search"}]}
        result: Final = filter_web_search_deployments(sample_deployments, request_kwargs)
        assert isinstance(result, list)
        result_ids: Final = tuple(d["model_info"]["id"] for d in result)
        assert "deployment-3" not in result_ids

    def test_anthropic_web_fetch_filters_unsupported(self):
        deployments: Final = [
            {"model_info": {"id": "d1", "supports_web_fetch": True}},
            {"model_info": {"id": "d2", "supports_web_fetch": False}},
        ]
        request_kwargs: Final = {"tools": [{"type": "web_fetch_20250910", "name": "web_fetch"}]}
        result: Final = filter_web_search_deployments(deployments, request_kwargs)
        assert isinstance(result, list)
        assert tuple(d["model_info"]["id"] for d in result) == ("d1",)

    def test_future_numeric_web_tool_versions_filter_unsupported(self):
        deployments: Final = [
            {"model_info": {"id": "supported", "supports_web_search": True, "supports_web_fetch": True}},
            {"model_info": {"id": "unsupported", "supports_web_search": False, "supports_web_fetch": False}},
        ]
        search_result: Final = filter_web_search_deployments(
            deployments, {"tools": [{"type": "web_search_20990101"}]}
        )
        fetch_result: Final = filter_web_search_deployments(
            deployments, {"tools": [{"type": "web_fetch_20990101"}]}
        )
        assert isinstance(search_result, list)
        assert isinstance(fetch_result, list)
        assert tuple(d["model_info"]["id"] for d in search_result) == ("supported",)
        assert tuple(d["model_info"]["id"] for d in fetch_result) == ("supported",)

    def test_custom_server_tool_prefixes_do_not_trigger_native_filtering(self):
        deployments: Final = [
            {"model_info": {"id": "custom", "supports_web_search": False, "supports_web_fetch": False}}
        ]
        assert filter_web_search_deployments(
            deployments, {"tools": [{"type": "web_search_custom"}]}
        ) == deployments
        assert filter_web_search_deployments(
            deployments, {"tools": [{"type": "web_fetch_notes"}]}
        ) == deployments

    def test_custom_function_names_do_not_trigger_native_capability_filtering(self):
        deployments: Final = [
            {"model_info": {"id": "custom", "supports_web_search": False, "supports_web_fetch": False}}
        ]
        assert filter_web_search_deployments(
            deployments, {"tools": [{"type": "function", "name": "web_search"}]}
        ) == deployments
        assert filter_web_search_deployments(
            deployments, {"tools": [{"type": "function", "name": "web_fetch"}]}
        ) == deployments
        assert filter_web_search_deployments(
            deployments, {"tools": [{"type": "function", "function": {"name": "web_search"}}]}
        ) == deployments
        assert filter_web_search_deployments(
            deployments, {"tools": [{"type": "function", "function": {"name": "web_fetch"}}]}
        ) == deployments

    def test_combined_native_search_and_fetch_require_both_capabilities(self):
        deployments: Final = [
            {"model_info": {"id": "both", "supports_web_search": True, "supports_web_fetch": True}},
            {"model_info": {"id": "search-only", "supports_web_search": True, "supports_web_fetch": False}},
            {"model_info": {"id": "fetch-only", "supports_web_search": False, "supports_web_fetch": True}},
        ]
        request_kwargs: Final = {
            "tools": [{"type": "web_search_20250305"}, {"type": "web_fetch_20250910"}]
        }
        result: Final = filter_web_search_deployments(deployments, request_kwargs)
        assert isinstance(result, list)
        assert tuple(d["model_info"]["id"] for d in result) == ("both",)

    def test_sync_router_filters_native_web_fetch_capability(self):
        router: Final = Router(
            model_list=[
                {
                    "model_name": "mixed-claude",
                    "litellm_params": {"model": "openai/gpt-4o-mini", "api_key": "sk-test"},
                    "model_info": {"id": "no-fetch", "supports_web_fetch": False},
                }
            ],
            routing_strategy="simple-shuffle",
        )
        request_kwargs: Final = {"tools": [{"type": "web_fetch_20250910"}]}
        with pytest.raises(RouterRateLimitError):
            router.get_available_deployment(
                model="mixed-claude",
                messages=[{"role": "user", "content": "fetch a page"}],
                request_kwargs=request_kwargs,
            )
'''
          if text.count(anchor) != 1:
              raise SystemExit("unexpected insertion anchor")
          path.write_text(text.replace(anchor, section + anchor, 1))
          PY
          git diff --check
      - name: Install dependencies
        run: |
          uv sync --frozen --group proxy-dev --group e2e-dev
          uv pip install orjson
      - name: Validate scoped test file
        run: |
          uv run --no-sync ruff check --config ruff-tests.toml tests/test_litellm/router_utils/test_router_utils_common_utils.py
          uv run --no-sync python scripts/type_discipline_gate.py --base 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a
          uv run --no-sync python scripts/test_quality_gate.py --base 31ca4ddf32ae6ed16d8518c82bd2608c248fcf5a
          uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py::TestFilterWebSearchDeployments -q
          uv run --no-sync pytest tests/test_litellm/router_utils/test_router_utils_common_utils.py -q
      - name: Publish scoped cleanup
        env:
          TARGET_BRANCH: litellm_fix_38982_anthropic_server_tool_routing
          EXPECTED_HEAD: e40354b0d2c7b70ca9354252b2c71eda32b9720a
        run: |
          git diff -- tests/test_litellm/router_utils/test_router_utils_common_utils.py > "$RUNNER_TEMP/cleanup.patch"
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git checkout -B publish "$EXPECTED_HEAD"
          git apply --index "$RUNNER_TEMP/cleanup.patch"
          git config user.name Vist233
          git config user.email 144699295+Vist233@users.noreply.github.com
          git commit -m "test(router): keep server-tool regression diff scoped"
          git push origin HEAD:"$TARGET_BRANCH"
